name: 버그 신고
description: 동작이 이상하거나, 무언가 깨졌거나, 노트에 문제가 생겼습니다
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        DevTrail 은 **볼트 상태에 따라 동작이 갈립니다.** 같은 명령이 사람마다
        다르게 동작해서, 아래 정보 없이는 재현이 거의 불가능합니다.

        ⚠️ **붙여넣기 전에 확인하세요.** `scan` 출력에는 볼트 경로와 폴더
        이름이 들어갑니다. 개인적인 이름이 있으면 지우고 올려주세요.

  - type: checkboxes
    id: data-loss
    attributes:
      label: 노트가 사라지거나 바뀌었습니까?
      options:
        - label: 예 — 노트가 사라졌거나, 내용이 바뀌었거나, 링크가 끊겼습니다
          required: false
  - type: markdown
    attributes:
      value: |
        위에 체크하셨다면 **먼저 이것부터 해주세요.** 조사는 그 다음입니다.

        ```bash
        devtrail undo            # 최근 작업 목록
        devtrail undo <ID>       # 무엇을 되돌릴지 먼저 확인 (아무것도 바꾸지 않습니다)
        devtrail undo <ID> --apply
        ```

        되돌아가지 않았다면 그 사실도 함께 적어주세요 — 그게 더 큰 버그입니다.

  - type: textarea
    id: what
    attributes:
      label: 무슨 일이 있었습니까
      description: 실행한 명령과 실제로 일어난 일
      placeholder: |
        $ devtrail augment --apply
        → 개발/개발일지 가 새로 생겼습니다. 저는 이미 Daily/ 를 쓰고 있는데요.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 무엇을 기대했습니까
      placeholder: 기존 Daily/ 폴더를 그대로 쓸 줄 알았습니다.
    validations:
      required: true

  - type: textarea
    id: version
    attributes:
      label: 버전
      description: "`devtrail version` 과 OS"
      render: text
      placeholder: |
        $ devtrail version
        devtrail 0.2.0
        macOS 15.2 / Apple Silicon
    validations:
      required: true

  - type: textarea
    id: doctor
    attributes:
      label: devtrail doctor
      description: 의존성 · 인증 · 권한 · 자동화 상태를 봅니다
      render: text
    validations:
      required: true

  - type: textarea
    id: scan
    attributes:
      label: devtrail scan
      description: |
        볼트 구조 · 메타데이터 · 플러그인 충돌을 봅니다.
        **경로와 폴더 이름을 지우고 올려주세요.**
      render: text
    validations:
      required: true

  - type: dropdown
    id: mode
    attributes:
      label: 설치 모드
      description: "`devtrail config get install.mode` 로 확인합니다"
      options:
        - new (새로 시작)
        - existing (기존 볼트에 얹기)
        - isolated (분리 설치)
        - 모르겠습니다
    validations:
      required: true

  - type: checkboxes
    id: vault-state
    attributes:
      label: 볼트 상태
      options:
        - label: 이 볼트를 DevTrail 설치 전부터 쓰고 있었습니다
        - label: Obsidian 플러그인을 직접 설정해둔 것이 있습니다
        - label: 다른 기기와 동기화 중입니다 (iCloud · Obsidian Sync · Git 등)
