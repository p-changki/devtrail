name: 기능 제안
description: 있었으면 하는 것, 또는 지금 방식이 불편한 이유
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        **지금 어떻게 하고 계신지**를 먼저 적어주시면 가장 도움이 됩니다.
        기능보다 그 불편이 진짜 정보입니다.

  - type: textarea
    id: problem
    attributes:
      label: 지금은 어떻게 하고 계십니까
      description: 무엇이 불편합니까. 손으로 하고 계신 일이 있습니까.
      placeholder: |
        유튜브 정리 노트를 매번 손으로 만들고, 태그를 직접 붙입니다.
        영상이 길면 요약을 따로 붙여넣습니다.
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: 어떤 것이 있으면 좋겠습니까
      description: 구체적이지 않아도 괜찮습니다.
    validations:
      required: true

  - type: checkboxes
    id: scope
    attributes:
      label: 무엇을 건드립니까 (아는 만큼만)
      options:
        - label: 사용자 노트를 만들거나 고칩니다
        - label: Obsidian 설정을 바꿉니다
        - label: 설정 스키마가 바뀔 것 같습니다
        - label: 기존 사용자에게 수동 조치가 필요할 것 같습니다

  - type: markdown
    attributes:
      value: |
        ---
        위 넷 중 하나라도 해당하면 논의가 조금 길어집니다.
        남의 볼트를 건드리는 변경은 되돌릴 수 있는지부터 정해야 해서입니다.
